<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume & Cover Letter Generator</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .container {
      max-width: 900px;
      margin-top: 40px;
    }
    .output-box {
      white-space: pre-wrap;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #dee2e6;
      margin-top: 20px;
    }
    .spinner-border {
      width: 1.5rem;
      height: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 class="mb-4 text-center">📄 Resume & Cover Letter Generator</h2>

    <div class="card shadow-sm p-4">
      <form>
        <div class="mb-3">
          <label for="name" class="form-label">👤 Name</label>
          <input type="text" class="form-control" id="name" placeholder="e.g., Tharun Kumar M">
        </div>

        <div class="mb-3">
          <label for="education" class="form-label">🎓 Education</label>
          <textarea class="form-control" id="education" placeholder="e.g., B.Tech in Computer Science, XYZ University"></textarea>
        </div>

        <div class="mb-3">
          <label for="experience" class="form-label">💼 Work Experience</label>
          <textarea class="form-control" id="experience" placeholder="e.g., 2 years as AI Intern at ABC Corp"></textarea>
        </div>

        <div class="mb-3">
          <label for="jobRole" class="form-label">🎯 Job Role Applying For</label>
          <input type="text" class="form-control" id="jobRole" placeholder="e.g., AI Engineer">
        </div>

        <button type="button" class="btn btn-primary w-100" onclick="generate()">🚀 Generate</button>

        <div id="status" class="mt-3 text-center text-muted" style="display: none;">
          <div class="spinner-border text-primary" role="status"></div>
          <span class="ms-2">Generating, please wait...</span>
        </div>
      </form>
    </div>

    <div class="output-box" id="outputContainer" style="display: none;">
      <h4>📄 Resume & Cover Letter</h4>
      <div id="output" class="mt-2"></div>
    </div>
  </div>

  <script>
    async function generate() {
      const name = document.getElementById('name').value;
      const education = document.getElementById('education').value;
      const experience = document.getElementById('experience').value;
      const jobRole = document.getElementById('jobRole').value;

      // Show spinner
      document.getElementById('status').style.display = 'block';
      document.getElementById('outputContainer').style.display = 'none';

      try {
        const res = await fetch('http://localhost:3000/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, education, experience, jobRole })
        });

        const data = await res.json();

        document.getElementById('status').style.display = 'none';

        if (data.output) {
          document.getElementById('output').innerText = data.output.trim();
          document.getElementById('outputContainer').style.display = 'block';
        } else {
          alert("No response from server.");
        }
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('status').style.display = 'none';
        alert("Failed to connect to the server.");
      }
    }
  </script>

</body>
</html>
